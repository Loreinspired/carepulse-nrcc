<nav class="tabs" id="dashboard-tabs" aria-label="Filter contacts" {% if oob %}hx-swap-oob="true"{% endif %}>
  <input type="hidden" id="active-tab-input" name="tab" value="{{ tab }}" />
  {% for key, label, count in tab_items %}
    <a class="tab" href="?tab={{ key }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}"
       hx-get="{% url 'outreach:dashboard' %}?tab={{ key }}"
       hx-include="#dashboard-search"
       hx-target="#dashboard-results"
       hx-push-url="?tab={{ key }}"
       {% if tab == key %}aria-current="page"{% endif %}>
      {{ label }} <span class="tab-count">{{ count }}</span>
    </a>
  {% endfor %}
</nav>
