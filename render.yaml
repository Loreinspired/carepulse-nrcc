databases:
  - name: carepulse-db
    plan: free
    databaseName: carepulse
    user: carepulse

services:
  - type: web
    name: carepulse-new-reality-christian
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WA_CLOUD_API_ENABLED
        value: "False"
      - key: CHURCH_NAME
        value: "New Reality Christian Center"
      - key: CHURCH_SHORT_NAME
        value: "New Reality Christian Center"
      - key: CHURCH_WHATSAPP_NUMBER
        value: "+2348000000000"
      - key: CHURCH_SUNDAY_TIME
        value: "Sundays at 8:00 AM"
      - key: CHURCH_ADDRESS
        value: "Ado-Ekiti, Ekiti State, Nigeria"
      # First admin account, created on deploy if missing (Render prompts for these on first setup).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: carepulse-db
          property: connectionString
